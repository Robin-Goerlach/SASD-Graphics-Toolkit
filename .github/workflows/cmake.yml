name: CMake
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository contracts and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check layout, links, translations and catalogs
        run: python tools/check_repository.py
      - name: Verify repository guard failure cases
        run: python tests/repository/test_repository_contracts.py
  build:
    name: C++ scaffold / ${{ matrix.os }}
    needs: repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure scaffold
        run: cmake -S . -B build -DSASD_GRAPHICS_BUILD_TESTS=ON -DSASD_GRAPHICS_BUILD_DEMOS=ON
      - name: Build configured targets
        run: cmake --build build --config Release
      - name: Repository CTest gate (no graphics unit tests yet)
        run: ctest --test-dir build --output-on-failure -C Release
